# Health check button: Actions tab -> "Health check" -> Run workflow.
# Read-only: checks the safety lock, the paper account connection, and sends a test email.
name: Health check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DT_ALPACA_API_KEY: ${{ secrets.DT_ALPACA_API_KEY }}
      DT_ALPACA_SECRET_KEY: ${{ secrets.DT_ALPACA_SECRET_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s day_trader/tests -t .
      - name: Paper account check
        run: python -m day_trader.check
      - name: Test email
        run: python -m day_trader.emailer
