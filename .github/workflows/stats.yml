# Stats button: Actions tab -> "Stats" -> Run workflow, then open the run to read them.
name: Stats
on:
  workflow_dispatch:
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m day_trader.stats
